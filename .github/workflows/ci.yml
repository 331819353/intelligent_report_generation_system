name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  graph-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify isolated NebulaGraph Compose
        run: ./scripts/verify-nebula-compose.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Static repository checks
        run: sh scripts/ci-check.sh
      - name: Go lint and build
        run: make lint build
      - name: Go tests
        run: go test ./... -count=1
      - name: Frontend lint and build
        run: make frontend-lint frontend-build
      - name: Dependency audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...
      - name: Start infrastructure and apply migrations
        run: make infra-up db-migrate db-verify
      - name: AskData PostgreSQL integration tests
        env:
          ASKDATA_INTEGRATION_DATABASE_URL: postgres://report_app:local_report_password@127.0.0.1:5432/intelligent_report_control?sslmode=disable
          ASKDATA_INTEGRATION_ADMIN_DATABASE_URL: postgres://report_admin:local_admin_password@127.0.0.1:5432/intelligent_report_control?sslmode=disable
        run: go test ./internal/askdata/orchestrator ./internal/askdata/security -count=1
      - name: Infrastructure logs on failure
        if: failure()
        run: make infra-logs
      - name: Stop infrastructure
        if: always()
        run: make infra-down
