name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci
      - name: Static repository checks
        run: sh scripts/ci-check.sh
      - name: Go lint and build
        run: make lint build
      - name: Frontend lint and build
        run: make frontend-lint frontend-build
      - name: Dependency audit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/...
      - name: Start infrastructure and apply migrations
        run: make infra-up db-migrate db-verify
      - name: Infrastructure logs on failure
        if: failure()
        run: make infra-logs
      - name: Stop infrastructure
        if: always()
        run: make infra-down
