name: intelligent-report-system

x-app-env-files: &app-env-files
  - path: ./.env.example
  - path: ./.env
    required: false

x-backend-build: &backend-build
  context: .
  dockerfile: deployments/app/Dockerfile

services:
  # 只在 verification profile 中启动的真实 MySQL 验收源。
  # 它不进入默认开发栈，也不保存平台控制数据；固定夹具用于验证非 PG 方言、
  # 元数据发现、结构差异和下架撤权的完整产品链路。
  mysql-e2e:
    image: mysql:8.4
    profiles: ["verification"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_E2E_ROOT_PASSWORD:-local_mysql_e2e_root_password}
      MYSQL_DATABASE: ${MYSQL_E2E_DATABASE:-sales_e2e}
      MYSQL_USER: ${MYSQL_E2E_USER:-report_reader}
      MYSQL_PASSWORD: ${MYSQL_E2E_PASSWORD:-local_mysql_e2e_reader_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${MYSQL_E2E_PORT:-3307}:3306"
    volumes:
      - mysql_e2e_data:/var/lib/mysql
      - ./deployments/mysql-e2e/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [report_net]

  # 平台控制面数据库：只保存账号、权限、数据源/数据集/指标和治理元数据。
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelligent_report_control}
      POSTGRES_USER: ${POSTGRES_USER:-report_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_admin_password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-report_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local_report_password}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-report_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:-local_worker_password}
      POSTGRES_CONNECTION_TEST_USER: ${POSTGRES_CONNECTION_TEST_USER:-report_connection_tester}
      POSTGRES_CONNECTION_TEST_PASSWORD: ${POSTGRES_CONNECTION_TEST_PASSWORD:-local_connection_test_password}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_control_data:/var/lib/postgresql/data
      - ./deployments/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [report_net]

  # 数据仓库数据库：保存 ODS/DIM/DWD/DWS/ADS 物理表和稳定发布视图。
  # ODS 正式运行按精确发布来源版本全量写入，预览仍只读取受控样本。
  postgres-warehouse:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-warehouse_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-local_warehouse_admin_password}
      WAREHOUSE_READER_USER: ${WAREHOUSE_READER_USER:-report_warehouse_reader}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}
      WAREHOUSE_WORKER_USER: ${WAREHOUSE_WORKER_USER:-report_warehouse_worker}
      WAREHOUSE_WORKER_PASSWORD: ${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}
      TZ: Asia/Shanghai
    ports:
      - "${WAREHOUSE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
      - ./deployments/postgres-warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [report_net]

  # 保存上传文件和元数据快照的 S3 兼容存储。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-report_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [report_net]

  # 一次性、幂等创建应用所需对象桶。
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-report_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local_minio_password}
      MINIO_BUCKET_UPLOADS: ${MINIO_BUCKET_UPLOADS:-uploads}
      MINIO_BUCKET_SNAPSHOTS: ${MINIO_BUCKET_SNAPSHOTS:-snapshots}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_UPLOADS}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_SNAPSHOTS}"
    restart: "no"
    networks: [report_net]

  # AskData 语义图的可重建开发投影；PostgreSQL 仍是权威事实源。
  nebula-metad:
    image: docker.io/vesoft/nebula-metad:v3.8.0
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - nebula_meta_data:/data/meta
      - nebula_meta_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-metad:19559/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [askdata_graph_cluster_net]

  nebula-storaged:
    image: docker.io/vesoft/nebula-storaged:v3.8.0
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
    volumes:
      - nebula_storage_data:/data/storage
      - nebula_storage_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-storaged:19779/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [askdata_graph_cluster_net]

  nebula-graphd:
    image: docker.io/vesoft/nebula-graphd:v3.8.0
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --port=9669
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --ws_http_port=19669
      - --log_dir=/logs
      - --enable_authorize=true
      - --auth_type=password
      - --v=0
      - --minloglevel=0
    depends_on:
      nebula-metad:
        condition: service_healthy
    volumes:
      - nebula_graph_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://nebula-graphd:19669/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # 集群控制面与客户端面分网；API/Worker 不能解析 metad/storaged。
    networks:
      askdata_graph_cluster_net: {}
      askdata_graph_client_net:
        aliases: [nebula-graphd-client]

  # 一次性、幂等完成 Storage 注册、Space/Schema 和最小权限账号初始化。
  nebula-init:
    image: docker.io/vesoft/nebula-console:v3.8.0
    entrypoint: [""]
    command: ["/bin/sh", "/opt/askdata-nebula/init.sh"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      NEBULA_GRAPH_ADDR: nebula-graphd-client
      NEBULA_GRAPH_PORT: "9669"
      NEBULA_SPACE: ${ASKDATA_NEBULA_SPACE:-askdata_semantic}
      NEBULA_ROOT_PASSWORD: ${ASKDATA_NEBULA_ROOT_PASSWORD:?ASKDATA_NEBULA_ROOT_PASSWORD is required}
      NEBULA_BOOTSTRAP_ROOT_PASSWORD: ${ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD:?ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD is required}
      NEBULA_API_USER: ${ASKDATA_NEBULA_API_USER:-askdata_api}
      NEBULA_API_PASSWORD: ${ASKDATA_NEBULA_API_PASSWORD:?ASKDATA_NEBULA_API_PASSWORD is required}
      NEBULA_WORKER_USER: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      NEBULA_WORKER_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
    depends_on:
      nebula-storaged:
        # storaged 的 HTTP status 只在 ADD HOSTS 后才就绪；init 必须先负责注册。
        condition: service_started
      nebula-graphd:
        condition: service_healthy
    volumes:
      - ./deployments/nebula/init.sh:/opt/askdata-nebula/init.sh:ro
      - ./deployments/nebula/schema.ngql:/opt/askdata-nebula/schema.ngql:ro
    restart: "no"
    networks: [askdata_graph_client_net]

  # 只在显式 verification profile 中运行，不进入默认开发常驻栈。
  nebula-verify:
    image: docker.io/vesoft/nebula-console:v3.8.0
    profiles: ["verification"]
    entrypoint: [""]
    command: ["/bin/sh", "/opt/askdata-nebula/verify.sh"]
    environment:
      NEBULA_GRAPH_ADDR: nebula-graphd-client
      NEBULA_GRAPH_PORT: "9669"
      NEBULA_SPACE: ${ASKDATA_NEBULA_SPACE:-askdata_semantic}
      NEBULA_ROOT_PASSWORD: ${ASKDATA_NEBULA_ROOT_PASSWORD:?ASKDATA_NEBULA_ROOT_PASSWORD is required}
      NEBULA_BOOTSTRAP_ROOT_PASSWORD: ${ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD:?ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD is required}
      NEBULA_API_USER: ${ASKDATA_NEBULA_API_USER:-askdata_api}
      NEBULA_API_PASSWORD: ${ASKDATA_NEBULA_API_PASSWORD:?ASKDATA_NEBULA_API_PASSWORD is required}
      NEBULA_WORKER_USER: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      NEBULA_WORKER_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
    depends_on:
      nebula-init:
        condition: service_completed_successfully
    volumes:
      - ./deployments/nebula/verify.sh:/opt/askdata-nebula/verify.sh:ro
    restart: "no"
    networks: [askdata_graph_client_net]

  # init 成功后才显式启动的本地调试/验收代理；graphd 本身永不发布宿主端口。
  nebula-loopback-proxy:
    image: docker.io/alpine/socat:1.8.0.3
    profiles: ["graph-access", "verification"]
    restart: unless-stopped
    command: ["TCP-LISTEN:9669,fork,reuseaddr,nodelay", "TCP:nebula-graphd-client:9669,nodelay"]
    depends_on:
      nebula-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ASKDATA_NEBULA_PORT:-9669}:9669"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9669"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [askdata_graph_client_net, askdata_graph_host_net]

  # 隔离数据库驱动与外部查询执行的 Python 服务。
  connector-service:
    build:
      context: ./connector_service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CONNECTOR_INTERNAL_TOKEN: ${CONNECTOR_INTERNAL_TOKEN:-local_connector_token_change_me}
      CONNECTOR_CONNECTION_TEST_TOKEN: ${CONNECTOR_CONNECTION_TEST_TOKEN:-local_connector_connection_test_token_change_me}
      CONNECTOR_MAX_CONNECTIONS_PER_SOURCE: ${CONNECTOR_MAX_CONNECTIONS_PER_SOURCE:-5}
      CONNECTOR_MAX_CONCURRENT_QUERIES: ${CONNECTOR_MAX_CONCURRENT_QUERIES:-10}
      # 生产环境必须显式注入，使用 ${VAR-} 保留空值并让 Connector 失败关闭。
      CONNECTOR_MAX_POOLS: ${CONNECTOR_MAX_POOLS-}
      CONNECTOR_MAX_TOTAL_CONNECTIONS: ${CONNECTOR_MAX_TOTAL_CONNECTIONS-}
      CONNECTOR_POOL_IDLE_TTL_SECONDS: ${CONNECTOR_POOL_IDLE_TTL_SECONDS:-300}
      CONNECTOR_HTTP_MAX_REQUEST_BYTES: ${CONNECTOR_HTTP_MAX_REQUEST_BYTES-}
      CONNECTOR_JSON_MAX_RESPONSE_BYTES: ${CONNECTOR_JSON_MAX_RESPONSE_BYTES-}
      CONNECTOR_METADATA_SYNC_MAX_ROWS: ${CONNECTOR_METADATA_SYNC_MAX_ROWS-}
      CONNECTOR_METADATA_SAMPLE_MAX_CELL_BYTES: ${CONNECTOR_METADATA_SAMPLE_MAX_CELL_BYTES-}
      CONNECTOR_METADATA_SAMPLE_MAX_ROW_BYTES: ${CONNECTOR_METADATA_SAMPLE_MAX_ROW_BYTES-}
      CONNECTOR_METADATA_SAMPLE_MAX_RESPONSE_BYTES: ${CONNECTOR_METADATA_SAMPLE_MAX_RESPONSE_BYTES-}
      CONNECTOR_STREAM_MAX_CELL_BYTES: ${CONNECTOR_STREAM_MAX_CELL_BYTES-}
      CONNECTOR_STREAM_MAX_ROW_BYTES: ${CONNECTOR_STREAM_MAX_ROW_BYTES-}
      CONNECTOR_STREAM_MAX_BYTES: ${CONNECTOR_STREAM_MAX_BYTES-}
      # 开发网络按服务名授权。production 启动会拒绝 hostname 规则，必须改为
      # IP/CIDR:port，并另行提供平台控制面 CIDR denylist。
      CONNECTOR_EGRESS_ALLOWLIST: ${CONNECTOR_EGRESS_ALLOWLIST-}
      CONNECTOR_EGRESS_DENYLIST: ${CONNECTOR_EGRESS_DENYLIST-}
    ports:
      - "127.0.0.1:${CONNECTOR_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [report_net]

  # 平台 API 使用控制库应用账号和仓库只读账号，不持有 worker 或测试账号。
  api:
    image: intelligent-report-system-backend:dev
    build: *backend-build
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-report_app}:${POSTGRES_APP_PASSWORD:-local_report_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_CONSOLE_ENDPOINT: http://minio:9001
      CONNECTOR_SERVICE_URL: http://connector-service:8090
      ASKDATA_NEBULA_ADDRESSES: nebula-graphd-client:9669
      ASKDATA_NEBULA_SPACE: ${ASKDATA_NEBULA_SPACE:-askdata_semantic}
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_API_USER:-askdata_api}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_API_PASSWORD:?ASKDATA_NEBULA_API_PASSWORD is required}
      ASKDATA_NEBULA_TLS_ENABLED: "false"
      # env_file 是共享的；显式清空 canonical secret，API 只保留上面的 GUEST 凭据。
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/api"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-warehouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      nebula-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [report_net, askdata_graph_client_net]

  # 通用 Worker 使用控制库 worker 账号和仓库写入账号。
  worker:
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      WORKER_DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-report_worker}:${POSTGRES_WORKER_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_WORKER_DATABASE_URL: postgres://${WAREHOUSE_WORKER_USER:-report_warehouse_worker}:${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WAREHOUSE_QUERY_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WORKER_TASK_TYPES: ${WORKER_TASK_TYPES:-}
      MINIO_ENDPOINT: minio:9000
      CONNECTOR_SERVICE_URL: http://connector-service:8090
      ASKDATA_NEBULA_ADDRESSES: nebula-graphd-client:9669
      ASKDATA_NEBULA_SPACE: ${ASKDATA_NEBULA_SPACE:-askdata_semantic}
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
      ASKDATA_NEBULA_TLS_ENABLED: "false"
      # Worker 只持有 USER 投影写账号，不持有 root/API canonical secret。
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-warehouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      connector-service:
        condition: service_healthy
      nebula-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net, askdata_graph_client_net]

  # AskData 独立扩缩入口；profile 默认不启用，避免与通用 Worker 重复消费。
  askdata-embedding-worker:
    profiles: ["askdata-workers"]
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      WORKER_TASK_TYPES: EMBEDDING
      WORKER_DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-report_worker}:${POSTGRES_WORKER_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_WORKER_DATABASE_URL: postgres://${WAREHOUSE_WORKER_USER:-report_warehouse_worker}:${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WAREHOUSE_QUERY_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net]

  askdata-profile-worker:
    profiles: ["askdata-workers"]
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      WORKER_TASK_TYPES: PROFILE
      WORKER_DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-report_worker}:${POSTGRES_WORKER_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_WORKER_DATABASE_URL: postgres://${WAREHOUSE_WORKER_USER:-report_warehouse_worker}:${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WAREHOUSE_QUERY_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      postgres-warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net]

  askdata-projector-worker:
    profiles: ["askdata-workers"]
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      WORKER_TASK_TYPES: PROJECTOR
      WORKER_DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-report_worker}:${POSTGRES_WORKER_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_WORKER_DATABASE_URL: postgres://${WAREHOUSE_WORKER_USER:-report_warehouse_worker}:${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WAREHOUSE_QUERY_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      ASKDATA_NEBULA_ADDRESSES: nebula-graphd-client:9669
      ASKDATA_NEBULA_SPACE: ${ASKDATA_NEBULA_SPACE:-askdata_semantic}
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
      ASKDATA_NEBULA_TLS_ENABLED: "false"
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      nebula-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net, askdata_graph_client_net]

  askdata-evaluator-worker:
    profiles: ["askdata-workers"]
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      WORKER_TASK_TYPES: EVALUATOR
      WORKER_DATABASE_URL: postgres://${POSTGRES_WORKER_USER:-report_worker}:${POSTGRES_WORKER_PASSWORD:-local_worker_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      WAREHOUSE_WORKER_DATABASE_URL: postgres://${WAREHOUSE_WORKER_USER:-report_warehouse_worker}:${WAREHOUSE_WORKER_PASSWORD:-local_warehouse_worker_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      WAREHOUSE_QUERY_DATABASE_URL: postgres://${WAREHOUSE_READER_USER:-report_warehouse_reader}:${WAREHOUSE_READER_PASSWORD:-local_warehouse_reader_password}@postgres-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-intelligent_report_warehouse}?sslmode=disable
      ASKDATA_NEBULA_USERNAME: ${ASKDATA_NEBULA_WORKER_USER:-askdata_worker}
      ASKDATA_NEBULA_PASSWORD: ${ASKDATA_NEBULA_WORKER_PASSWORD:?ASKDATA_NEBULA_WORKER_PASSWORD is required}
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net]

  # 连接测试 Worker 仅持有专用控制库、Connector 和 uploads 读取凭据。
  connection-test-worker:
    image: intelligent-report-system-backend:dev
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      CONNECTION_TEST_DATABASE_URL: postgres://${POSTGRES_CONNECTION_TEST_USER:-report_connection_tester}:${POSTGRES_CONNECTION_TEST_PASSWORD:-local_connection_test_password}@postgres:5432/${POSTGRES_DB:-intelligent_report_control}?sslmode=disable
      CONNECTION_TEST_MINIO_ENDPOINT: minio:9000
      CONNECTOR_SERVICE_URL: http://connector-service:8090
      # 共享 env_file 不得让连接测试进程获得任何图凭据。
      ASKDATA_NEBULA_ADDRESSES: ""
      ASKDATA_NEBULA_SPACE: ""
      ASKDATA_NEBULA_USERNAME: ""
      ASKDATA_NEBULA_PASSWORD: ""
      ASKDATA_NEBULA_TLS_ENABLED: ""
      ASKDATA_NEBULA_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_BOOTSTRAP_ROOT_PASSWORD: ""
      ASKDATA_NEBULA_API_PASSWORD: ""
      ASKDATA_NEBULA_WORKER_PASSWORD: ""
    command: ["/app/connection-test-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      connector-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks: [report_net]

  # Vite 开发服务器通过容器网络代理 API，避免依赖宿主终端进程。
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: intelligent-report-system-web:dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    # 源码挂载进容器，否则容器只会持续提供镜像构建时拷贝的旧代码。
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
      - ./api/examples:/app/api/examples:ro
      - ./api/schemas:/app/api/schemas:ro
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [report_net]

volumes:
  mysql_e2e_data:
  postgres_control_data:
  postgres_warehouse_data:
  minio_data:
  nebula_meta_data:
  nebula_meta_logs:
  nebula_storage_data:
  nebula_storage_logs:
  nebula_graph_logs:

networks:
  report_net:
    driver: bridge
  askdata_graph_cluster_net:
    driver: bridge
    internal: true
  askdata_graph_client_net:
    driver: bridge
    internal: true
  askdata_graph_host_net:
    driver: bridge
